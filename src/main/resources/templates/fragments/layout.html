<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Book Illustrator'">Book Illustrator</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="topnav" class="navbar app-topnav border-bottom px-4">
    <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
        <i class="bi bi-palette2 text-primary"></i>
        <span>Book Illustrator</span>
    </span>
</nav>

<aside th:fragment="sidenav(section)" class="app-sidenav border-end">
    <nav class="app-side-actions" aria-label="Main">
        <a class="app-side-link" th:href="@{/chats/new}">
            <i class="bi bi-pencil-square"></i>
            <span class="app-side-label">New chat</span>
        </a>
        <a class="app-side-link" th:href="@{/threads/new}">
            <i class="bi bi-image"></i>
            <span class="app-side-label">New image</span>
        </a>
        <a class="app-side-link" th:classappend="${section == 'books'} ? 'active'" th:href="@{/books}">
            <i class="bi bi-book"></i>
            <span class="app-side-label">Books</span>
        </a>
    </nav>

    <div class="app-side-scroll">
        <section class="app-side-section">
            <button class="app-side-heading" type="button"
                    data-bs-toggle="collapse" data-bs-target="#nav-chats"
                    aria-expanded="true" aria-controls="nav-chats">
                <span>Chats</span>
                <i class="bi bi-chevron-down app-chevron"></i>
            </button>
            <div class="collapse show" id="nav-chats" data-remember-collapse>
                <ul class="app-side-list"
                    hx-get="/nav/chats" hx-trigger="load, chats-changed from:body">
                    <li class="app-side-empty">Loading…</li>
                </ul>
            </div>
        </section>

        <section class="app-side-section">
            <button class="app-side-heading" type="button"
                    data-bs-toggle="collapse" data-bs-target="#nav-threads"
                    aria-expanded="true" aria-controls="nav-threads">
                <span>Images</span>
                <i class="bi bi-chevron-down app-chevron"></i>
            </button>
            <div class="collapse show" id="nav-threads" data-remember-collapse>
                <ul class="app-side-list"
                    hx-get="/nav/threads" hx-trigger="load, threads-changed from:body">
                    <li class="app-side-empty">Loading…</li>
                </ul>
            </div>
        </section>
    </div>
</aside>

<div th:fragment="pageAlert" id="page-alert" data-alert></div>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
