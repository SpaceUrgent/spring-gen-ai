<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Books')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topnav}"></nav>
<div class="app-body">
    <aside th:replace="~{fragments/layout :: sidenav('books')}"></aside>
    <main class="app-main">
        <div class="app-page">
            <div th:replace="~{fragments/layout :: pageAlert}"></div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h1 class="h4 mb-1">Books</h1>
                    <p class="text-body-secondary mb-0">Books you can ask questions about and illustrate.</p>
                </div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#upload-modal">
                    <i class="bi bi-upload"></i>
                    <span>Upload book</span>
                </button>
            </div>

            <div id="book-list" th:fragment="list">
                <div th:if="${books.isEmpty()}" class="app-empty">
                    <i class="bi bi-book"></i>
                    <p class="mb-0">No books yet. Upload a PDF to get started.</p>
                </div>
                <div th:unless="${books.isEmpty()}" class="card">
                    <ul class="list-group list-group-flush">
                        <li th:each="book : ${books}" class="list-group-item d-flex align-items-center gap-3 py-3">
                            <i class="bi bi-journal-text fs-4 text-primary"></i>
                            <div class="flex-grow-1 min-w-0">
                                <div class="fw-medium text-truncate" th:text="${book.title}">Title</div>
                                <div class="small text-body-secondary">
                                    Uploaded <span th:text="${#temporals.format(book.createdAt, 'yyyy-MM-dd HH:mm')}">date</span>
                                </div>
                            </div>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/threads/new(bookId=${book.id})}">
                                <i class="bi bi-image"></i>
                                <span>Illustrate</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="upload-modal" tabindex="-1" aria-labelledby="upload-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="upload-form" class="modal-content"
              hx-post="/books" hx-encoding="multipart/form-data"
              hx-target="#book-list" hx-swap="outerHTML"
              hx-headers='{"X-Error-Target": "#upload-alert"}'
              hx-indicator="#upload-indicator" hx-disabled-elt="find button[type=submit]">
            <div class="modal-header">
                <h2 class="modal-title h5" id="upload-modal-title">Upload book</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="upload-alert" data-alert></div>
                <div class="mb-3">
                    <label for="upload-title" class="form-label">Title</label>
                    <input id="upload-title" name="title" type="text" class="form-control" required
                           placeholder="The Lord of the Rings">
                </div>
                <div class="mb-1">
                    <label for="upload-file" class="form-label">PDF file</label>
                    <input id="upload-file" name="file" type="file" class="form-control" accept="application/pdf" required>
                </div>
                <div id="upload-indicator" class="htmx-indicator small text-body-secondary mt-3">
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                    Reading and indexing the book. Large books take a few minutes.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-upload"></i>
                    <span>Upload</span>
                </button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
